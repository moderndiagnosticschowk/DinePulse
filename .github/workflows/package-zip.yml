name: DinePulse ZIP
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r DinePulse-main.zip . -x ".git/*" "node_modules/*" ".next/*"
      - uses: actions/upload-artifact@v4
        with:
          name: DinePulse-main
          path: DinePulse-main.zip
          retention-days: 7
