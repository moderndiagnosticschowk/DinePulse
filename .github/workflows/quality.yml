name: DinePulse quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'phase-*']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PostgreSQL SQL syntax
        run: |
          python -m pip install --disable-pip-version-check 'pglast>=7,<8'
          python scripts/validate_sql.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test report currency arithmetic
        run: node --test apps/web/lib/report-money.test.mjs
      - name: Install workspace dependencies
        id: install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run build
